about_title: About Me
about_description: |
  I’m a mechatronics engineer with 12 years of experience designing electromechanical systems for robotics, automation, and high-volume consumer and industrial products. I specialize in turning complex requirements into manufacturing-ready designs by integrating mechanical systems, sensors, actuators, and control logic with a strong focus on reliability, cost, and scalability.

  My experience spans concept development, detailed design, prototyping, validation, and production support. I’m highly proficient in Creo, NX, CATIA, SolidWorks, and Onshape, and I regularly work hands on with power tools, rapid prototyping, and 3D printing to iterate quickly and de-risk designs early. My work has resulted in two granted patents.

  I work closely with program and product stakeholders, engineering teams, and suppliers to align requirements and technical execution. I’m experienced in navigating tradeoffs and influencing design decisions to deliver systems that meet performance, cost, and business objectives.

  Outside of work, I spend time on hands on projects such as Arduino based home automation and woodworking. I also enjoy volleyball and PC gaming, which complement my technical interests, teamwork and leadership skills.

